name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check HTML files exist
        run: |
          test -f index.html || (echo "❌ index.html not found" && exit 1)
          test -f style.css || (echo "❌ style.css not found" && exit 1)
          test -f script.js || (echo "❌ script.js not found" && exit 1)
          echo "✅ Все файлы на месте"

      - name: Validate HTML (basic)
        run: |
          grep -q "<!DOCTYPE html>" index.html || (echo "❌ Нет DOCTYPE" && exit 1)
          grep -q "</html>" index.html || (echo "❌ Нет закрывающего </html>" && exit 1)
          echo "✅ HTML валиден"

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
